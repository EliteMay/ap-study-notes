name: Validate AP Study Guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate JSON and references
        run: node tests/validate.mjs
      - name: Validate Phase 1 foundation pilot
        run: node tests/validate-phase1-foundation.mjs
      - name: Validate Phase 1 algorithm pilot
        run: node tests/validate-phase1-algorithm.mjs
      - name: Validate domain audits
        run: node tests/validate-audits.mjs
      - name: Validate Security 501-term audit
        run: node tests/validate-security-audit.mjs
      - name: Validate Computer Systems coverage
        run: node tests/validate-computer-systems.mjs
      - name: Validate curriculum expansion and unified hubs
        run: node tests/validate-curriculum-expansion.mjs
      - name: Validate original practice bank
        run: node tests/validate-practice.mjs
      - name: Validate Subject B case practice
        run: node tests/validate-cases.mjs
      - name: Validate full-length mock exam
        run: node tests/validate-mock.mjs
      - name: Validate latest public official AP exam mapping
        run: node tests/validate-official-past.mjs
      - name: Validate past-question lesson mapping
        run: node tests/validate-past-lesson-map.mjs
      - name: Validate current mastery dashboard
        run: node tests/validate-progress.mjs
      - name: Validate runtime quality architecture
        run: node tests/validate-runtime-quality.mjs
      - name: Validate unified glossary and action home
        run: node tests/validate-glossary.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke and visual review
        run: |
          python3 -m http.server 4173 >/tmp/ap-study-http.log 2>&1 &
          node tests/e2e-smoke.mjs
          node tests/e2e-phase1-algorithm.mjs
          node tests/visual-review.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
